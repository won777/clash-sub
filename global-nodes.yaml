#    可能是機房 IP 被擋，也可能是 curl 指紋問題——手機真瀏覽器登入測才算數。
# 4. 免費節點死得快，建議用「♻️ 自动选择」讓 FlClash 自動挑活的。
# 5. ChatGPT、Gemini 在 VM 側 18 個已驗證節點全部通（200）。
