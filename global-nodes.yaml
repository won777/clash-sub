# 全球免費節點（FlClash / Mihomo 訂閱）
# 生成時間：2026-11-28（VM 篩選，僅供初篩；手機實測才是終審）
# 來源：Au1rxx/free-vpn-subscriptions、freevpnkeys、shaoyouvip、舊 us.yaml 草稿
# 候選 609 個獨立端點 → 連通 68 個 → 深度驗證 18 個
# ── 重要 ──
# 1. 全部 61 個都是機房／數據中心 IP，沒有找到任何家寬（住宅寬頻）節點。
#    免費池子裡家寬基本不存在；想要家寬只能付費買，免費的不要再找了。
